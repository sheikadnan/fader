name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package app bundle
        run: ./Scripts/build-app.sh
      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: Fader.app
          path: Fader.app
